# XSS Platform nginx example
# Web root must be the repository root (where index.php lives).
server {
    listen       80;
    server_name  xss.localhost;
    root         /path/to/xssplatform;
    index        index.php;

    # Receiver endpoints keep their legacy URLs
    rewrite "^/([0-9a-zA-Z]{6})$" /index.php?do=code&urlKey=$1 last;
    rewrite "^/do/auth/(\w+?)(/domain/([\w\.]+?))?$" /index.php?do=do&auth=$1&domain=$3 last;
    rewrite "^/register/(.*?)$" /index.php?do=register&key=$1 last;

    # SPA deep links fall back to index.php
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Build output and plugin download
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /dist/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }
}
